# The current single-node k3s host (4×T4, slides under /data/omero/data,
# weights under /data/models). hostPath volumes instead of NFS; GPU
# scheduling needs the NVIDIA device plugin and the nvidia containerd runtime.
#
# Model workers and tissue-api pull from Azure Container Registry (aimlabacr);
# the gateway stays on its local :dev tag. Argo CD Image Updater rewrites the
# worker newTag values after each pipeline push; the tissue-api pipeline
# restarts its Deployment itself (it never scales from zero).
#
#   kubectl apply -k deploy/k8s/overlays/k3s-local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: aimlab/aim-inference-worker-deepliif
    newName: aimlabacr.azurecr.io/aimlab/aim-inference-worker-deepliif
    newTag: main
  - name: aimlab/aim-inference-worker-hovernet
    newName: aimlabacr.azurecr.io/aimlab/aim-inference-worker-hovernet
    newTag: main
  - name: aimlab/aim-inference-worker-ec
    newName: aimlabacr.azurecr.io/aimlab/aim-inference-worker-ec
    newTag: main
  - name: aimlab/aim-inference-worker-pdac
    newName: aimlabacr.azurecr.io/aimlab/aim-inference-worker-pdac
    newTag: main
  # Built by the aim-inference-tissue-api repo's pipeline.
  - name: aimlab/aim-inference-tissue-api
    newName: aimlabacr.azurecr.io/aimlab/aim-inference-tissue-api
    newTag: main
patches:
  - path: hostpath-volumes.yaml
    target:
      kind: Deployment
      labelSelector: aim.inference/model,aim.inference/model notin (sam3)
  - path: hostpath-volumes-tissue.yaml
    target:
      kind: Deployment
      name: tissue-api
  # Persist the Hugging Face cache (GigaPath encoder, SAM3) across pod restarts.
  - path: hf-cache.yaml
    target:
      kind: Deployment
      labelSelector: aim.inference/model in (pdac, sam3)
  - target:
      kind: PersistentVolumeClaim
    patch: |
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: slides
  - target:
      kind: PersistentVolumeClaim
      name: model-weights
    patch: |
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: model-weights
  - target:
      kind: Ingress
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: inference-gateway
  - target:
      kind: Deployment
      labelSelector: aim.inference/model
    patch: |
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: nvidia
  # The ACR-backed Deployments (four model workers + tissue-api, labelled
  # aim.inference/model=sam3) need the registry pull secret. They track the
  # moving :main tag, so pull on every pod start; otherwise a node with a
  # cached :main keeps running the old build.
  - target:
      kind: Deployment
      labelSelector: aim.inference/model in (pdac, hovernet, ec_cancer, deepliif, sam3)
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: acr-pull
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  # One host, four GPUs: never ask for more pods than cards.
  - target:
      kind: ScaledObject
    patch: |
      - op: replace
        path: /spec/maxReplicaCount
        value: 4
  - target:
      kind: Deployment
      name: inference-gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: inference-gateway
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
  # Expose the gateway on the host for AIMViewer (which runs outside k3s).
  - target:
      kind: Service
      name: inference-gateway
    patch: |
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  # tissue-api is always on and AIMViewer calls it synchronously, so a
  # rollout (the tissue-api pipeline restarts it after each build) starts the
  # new pod before stopping the old one. The surge pod needs one free GPU
  # slot (8 slots on this host); if none is free the rollout waits and the
  # old pod keeps serving.
  - target:
      kind: Deployment
      name: tissue-api
    patch: |
      - op: replace
        path: /spec/strategy/rollingUpdate
        value: {maxSurge: 1, maxUnavailable: 0}
  # And the tissue helpers, which AIMViewer calls synchronously.
  - target:
      kind: Service
      name: tissue-api
    patch: |
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30800
